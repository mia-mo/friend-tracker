<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Friend Tracker</title>
    <link
      href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="stars"></div>
    <main class="layout">
      <header class="site-header">
        <h1>Friend tracker</h1>
      </header>

      <nav class="page-links" aria-label="Tracker pages">
        <a class="page-link active" href="./index.html">Out of town</a>
        <a class="page-link" href="./steps.html">Step challenge</a>
      </nav>

      <section class="content-grid" aria-label="Out of town page">
        <section class="panel">
          <h2 class="panel-title">Add out of town entry</h2>

          <form id="ooo-form" class="form">
            <label>
              Name
              <input id="name" name="name" type="text" maxlength="60" required />
            </label>

            <label>
              Start date
              <input id="startDate" name="startDate" type="date" required />
            </label>

            <label>
              End date
              <input id="endDate" name="endDate" type="date" required />
            </label>

            <label>
              Location (optional)
              <input id="location" name="location" type="text" maxlength="100" />
            </label>

            <label>
              Notes (optional)
              <textarea id="notes" name="notes" rows="3" maxlength="240"></textarea>
            </label>

            <button type="submit">Submit Entry</button>
          </form>

          <p id="status" class="status" aria-live="polite"></p>
        </section>

        <section class="calendar-shell">
          <h2 class="panel-title">Calendar View</h2>
          <div id="calendar"></div>
        </section>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
    <script type="module" src="./app.js"></script>
  </body>
</html>

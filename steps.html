<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Friend tracker - Step challenge</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="stars"></div>
    <main class="layout">
      <header class="site-header">
        <h1>Friend tracker</h1>
      </header>

      <nav class="page-links" aria-label="Tracker pages">
        <a class="page-link" href="./index.html">Out of town</a>
        <a class="page-link active" href="./steps.html">Step challenge</a>
      </nav>

      <section class="content-grid" aria-label="Step challenge page">
        <section class="panel">
          <h2 class="panel-title">Add daily steps</h2>

          <form id="step-form" class="form">
            <label>
              Name
              <select id="stepName" name="stepName" required>
                <option value="">Select a name</option>
                <option value="Dara">Dara</option>
                <option value="Jackie">Jackie</option>
                <option value="Katy">Katy</option>
                <option value="Mia">Mia</option>
                <option value="Naomi">Naomi</option>
              </select>
            </label>

            <label>
              Date (August 2026)
              <input
                id="stepDate"
                name="stepDate"
                type="date"
                min="2026-08-01"
                max="2026-08-31"
                required
              />
            </label>

            <label>
              Steps
              <input id="stepCount" name="stepCount" type="number" min="0" step="1" required />
            </label>

            <button id="step-submit-btn" type="submit">Save steps</button>
            <button id="step-cancel-btn" class="secondary-button hidden" type="button">
              Cancel edit
            </button>
          </form>

          <h2 class="panel-title panel-title-gap">Past entries</h2>
          <p class="month-note">Select an entry to edit and save your changes.</p>
          <div class="entry-controls">
            <label class="entry-filter-label" for="entryFilterName">
              Filter by name
              <select id="entryFilterName" name="entryFilterName">
                <option value="all">All names</option>
                <option value="Dara">Dara</option>
                <option value="Jackie">Jackie</option>
                <option value="Katy">Katy</option>
                <option value="Mia">Mia</option>
                <option value="Naomi">Naomi</option>
              </select>
            </label>
            <p id="entryListMeta" class="entry-meta" aria-live="polite"></p>
          </div>
          <div id="step-entry-list" class="entry-list" aria-live="polite"></div>
          <button id="entry-show-more-btn" class="secondary-button hidden" type="button">
            Show more
          </button>

          <h2 class="panel-title panel-title-gap">Team goal</h2>
          <form id="goal-form" class="form">
            <label>
              Total team goal (August)
              <input id="goalCount" name="goalCount" type="number" min="1" step="1" required />
            </label>

            <button type="submit">Set goal</button>
          </form>

          <p id="step-status" class="status" aria-live="polite"></p>
        </section>

        <section class="calendar-shell chart-shell">
          <h2 class="panel-title">Step trends</h2>
          <p class="month-note">Viewing August 2026 daily step totals by person and team.</p>
          <div class="chart-wrap">
            <canvas id="steps-chart" aria-label="Step challenge line graph" role="img"></canvas>
          </div>
        </section>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
    <script type="module" src="./steps.js"></script>
  </body>
</html>
